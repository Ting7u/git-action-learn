name: Hello World

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: 打印问候
        run: echo "Hello, Github Actions!"

      - name: 查看当前环境
        run: |
          echo "当前系统: "
          uname -a
          echo "当前时间: "
          date
      - name: "查看触发事件"
        run: echo "事件：${{ github.event_name }}"
